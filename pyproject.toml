[project]
name = "cascade-ai"
version = "0.0.1"
description = "Turn a team meeting into shipped code. Recording in, working tested PR out, humans approving at every gate."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "ThinkNext Software Solutions", email = "hello@thinknextsoftware.com" }
]
keywords = ["ai", "agent", "meeting-transcription", "code-generation", "team-knowledge", "sdlc"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "pydantic>=2.0",
    "PyGithub>=2.0",
    "PyYAML>=6.0",
    "openai-whisper>=20231117",
    "pyannote.audio>=3.1",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Optional LLM and provider integrations. Install on demand:
#   pip install -e .[openai]      # adds OpenAI provider
#   pip install -e .[google]      # adds Google Gemini provider
#   pip install -e .[claude-code] # adds Claude Code SDK
#   pip install -e .[gitlab]      # adds GitLab support
#   pip install -e .[jira]        # adds Jira support
#   pip install -e .[all]         # adds everything
openai = ["openai>=1.50"]
google = ["google-genai>=0.3"]
claude-code = ["claude-agent-sdk>=0.1"]
gitlab = ["python-gitlab>=4.0"]
jira = ["atlassian-python-api>=3.41"]
all = [
    "openai>=1.50",
    "google-genai>=0.3",
    "claude-agent-sdk>=0.1",
    "python-gitlab>=4.0",
    "atlassian-python-api>=3.41",
]

[project.scripts]
cascade = "cascade.cli:main"

[project.urls]
Homepage = "https://thinknextsoftware.com"
Repository = "https://github.com/Thinknext-Software-Solutions/Cascade"
Issues = "https://github.com/Thinknext-Software-Solutions/Cascade/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=cascade --cov-report=term-missing"
