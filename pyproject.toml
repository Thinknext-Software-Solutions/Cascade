[project]
name = "cascade-ai"
version = "0.0.1"
description = "Turn a team meeting into shipped code. Recording in, working tested PR out, humans approving at every gate."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "ThinkNext Software Solutions", email = "hello@thinknextsoftware.com" }
]
keywords = ["ai", "agent", "meeting-transcription", "code-generation", "team-knowledge", "sdlc"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "pydantic>=2.0",
    "PyGithub>=2.0",
    "PyYAML>=6.0",
    "openai-whisper>=20231117",
    "pyannote.audio>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
cascade = "cascade.cli:main"

[project.urls]
Homepage = "https://thinknextsoftware.com"
Repository = "https://github.com/thinknext/cascade"
Issues = "https://github.com/thinknext/cascade/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=cascade --cov-report=term-missing"
