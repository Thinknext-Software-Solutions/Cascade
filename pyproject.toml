[project]
name = "cascade-agent"
version = "0.1.0a1"
description = "Turn a team meeting into shipped code. Recording in, working tested PR out, humans approving at every gate."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "ThinkNext Software Solutions", email = "hello@thinknextsoftware.com" }
]
keywords = ["ai", "agent", "meeting-transcription", "code-generation", "team-knowledge", "sdlc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Environment :: Console",
]

# The base install stays lean: just the CLI, Anthropic, GitHub, and the
# core orchestration. Heavy ML deps (Whisper for ingest), other LLM
# providers, other VCS providers, and the Studio web UI all live in
# optional extras so first-time `pip install cascade-agent` finishes in
# under 30 seconds.
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "pydantic>=2.0",
    "PyGithub>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.0",
    "twine>=5.0",
]
# Optional integrations. Install on demand:
#   pip install "cascade-agent[ingest]"      # Whisper + diarization for cascade ingest
#   pip install "cascade-agent[openai]"      # OpenAI provider
#   pip install "cascade-agent[google]"      # Google Gemini provider
#   pip install "cascade-agent[claude-code]" # Claude Code SDK
#   pip install "cascade-agent[gitlab]"      # GitLab support
#   pip install "cascade-agent[jira]"        # Jira support
#   pip install "cascade-agent[studio]"      # Web dashboard (FastAPI + uvicorn)
#   pip install "cascade-agent[all]"         # Everything except ingest (ingest is huge)
ingest = [
    "openai-whisper>=20231117",
    "pyannote.audio>=3.1",
]
openai = ["openai>=1.50"]
google = ["google-genai>=0.3"]
claude-code = ["claude-agent-sdk>=0.1"]
gitlab = ["python-gitlab>=4.0"]
jira = ["atlassian-python-api>=3.41"]
studio = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.0",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",
]
# `all` deliberately omits `ingest` to keep installs reasonable. Users
# who want meeting transcription pull `[all,ingest]` explicitly.
all = [
    "openai>=1.50",
    "google-genai>=0.3",
    "claude-agent-sdk>=0.1",
    "python-gitlab>=4.0",
    "atlassian-python-api>=3.41",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.0",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",
]

[tool.hatch.build.targets.wheel]
# The package lives under src/, so hatch needs to be told explicitly.
# The Studio static bundle (src/cascade/studio/static/) is bundled with
# the package automatically by hatch's package discovery. It's
# regenerated from the cascade-studio repo before each release with
# `npm run build && cp -r out ...`.
packages = ["src/cascade"]
artifacts = ["src/cascade/studio/static/**/*"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cascade",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[project.scripts]
cascade = "cascade.cli:main"

[project.urls]
Homepage = "https://cascadeagent.dev"
Documentation = "https://cascadeagent.dev"
Repository = "https://github.com/Thinknext-Software-Solutions/Cascade"
Issues = "https://github.com/Thinknext-Software-Solutions/Cascade/issues"
Changelog = "https://github.com/Thinknext-Software-Solutions/Cascade/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=cascade --cov-report=term-missing"
